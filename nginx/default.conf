
# API Gateway - Nexus Retail
# Fase 1: configuracion minima

# Logs sin URL, query string ni IP del cliente
log_format gateway 'method=$request_method status=$status '
                'bytes=$body_bytes_sent duration=$request_time';

server {
    listen 8080;
    server_name _;

    server_tokens off;

    access_log /var/log/nginx/access.log gateway;

    default_type application/json;
    types { }

    # Estado del Gateway
    location = /health {
        access_log off;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405 '{"error":"metodo_no_permitido"}';
        }

        add_header Cache-Control "no-store" always;

        return 200 '{"status":"ok","service":"gateway"}';
    }

    # Rutas pendientes de implementar en Fase 2
    location / {
        return 404 '{"error":"ruta_no_encontrada"}';
    }
}
