    # API Gateway - Nexus Retail - Fase 2
#
# /               -> front:80
# /api/dominio/   -> dominio:3000
# /api/ia/        -> ia:8000
# /health         -> Gateway

# Logs sin IP, URL ni parametros personales.
log_format gateway 'metodo=$request_method estado=$status bytes=$body_bytes_sent '
                   'duracion=$request_time upstream=$upstream_response_time '
                   'ruta=$gw_ruta';

# Caddy fija X-Forwarded-For en produccion; en pruebas directas se usa la IP de
# la conexion. Una clave vacia excluye los metodos ajenos a cada cuota.
map $http_x_forwarded_for $nexus_client_key {
    ""      $binary_remote_addr;
    default $http_x_forwarded_for;
}

map $request_method $campanas_post_key {
    default "";
    POST    $nexus_client_key;
}

map $request_method $campanas_get_key {
    default "";
    GET     $nexus_client_key;
    HEAD    $nexus_client_key;
}

limit_req_zone $campanas_post_key zone=campanas_post:10m rate=3r/m;
limit_req_zone $campanas_get_key  zone=campanas_get:10m  rate=60r/m;

# Servicios internos.
upstream front {
    zone front 64k;
    resolver 127.0.0.11 valid=2s ipv6=off;
    server front:80 resolve;
}

upstream dominio {
    zone dominio 64k;
    resolver 127.0.0.11 valid=2s ipv6=off;
    server dominio:3000 resolve;
}

upstream ia {
    zone ia 64k;
    resolver 127.0.0.11 valid=2s ipv6=off;
    server ia:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    absolute_redirect off;

    access_log /var/log/nginx/access.log gateway;

    error_log /var/log/nginx/error.log crit;

    default_type application/json;
    types { }

    set $gw_ruta "gateway";

    # Configuracion general de comunicacion interna
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    proxy_next_upstream error timeout;
    proxy_intercept_errors off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Estado interno distinto para poder transformar la respuesta del modulo
    # limit_req sin volver a procesar el 429 publico del handler JSON.
    limit_req_status 418;

    # Healthcheck local del Gateway.
    location = /health {
        access_log off;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405 '{"error":"metodo_no_permitido"}';
        }

        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    # Dominio: redireccion cuando falta la barra final.
    location = /api/dominio {
        return 308 /api/dominio/$is_args$args;
    }

    # Alias compatible usado por el front. Comparte las cuotas con
    # /api/campanas/ para que una ruta no permita evadir a la otra.
    location /api/dominio/campanas/ {
        set $gw_ruta "dominio";

        limit_req zone=campanas_post burst=2 nodelay;
        limit_req zone=campanas_get burst=20 nodelay;

        error_page 418 = @gw_limite_solicitudes;
        error_page 502 503 = @gw_no_disponible;
        error_page 504 = @gw_tiempo_agotado;

        proxy_pass http://dominio/campanas/;
    }

    # Dominio: elimina el prefijo /api/dominio/.
    location /api/dominio/ {
        set $gw_ruta "dominio";

        error_page 502 503 = @gw_no_disponible;
        error_page 504 = @gw_tiempo_agotado;

        proxy_pass http://dominio/;
    }

    # IA: redireccion cuando falta la barra final.
    location = /api/ia {
        return 308 /api/ia/$is_args$args;
    }

    # IA: elimina el prefijo /api/ia/.
    location /api/ia/ {
        set $gw_ruta "ia";

        if ($request_method !~ ^(GET|POST)$) {
            add_header Allow "GET, POST" always;
            return 405 '{"error":"metodo_no_permitido"}';
        }

        error_page 502 503 = @gw_no_disponible;
        error_page 504 = @gw_tiempo_agotado;

        proxy_pass http://ia/;
    }

    # Contrato publico EP3: el dominio valida, persiste y llama a la IA.
    location = /api/predict {
        set $gw_ruta "dominio";
        error_page 502 503 = @gw_no_disponible;
        error_page 504 = @gw_tiempo_agotado;
        proxy_pass http://dominio/predict;
    }

    
    # EP3: campanas de marketing generadas por NVIDIA LLM.
    # /api/campanas/2 -> dominio:3000/campanas/2
    location /api/campanas/ {
        set $gw_ruta "dominio";

        limit_req zone=campanas_post burst=2 nodelay;
        limit_req zone=campanas_get burst=20 nodelay;

        error_page 418 = @gw_limite_solicitudes;
        error_page 502 503 = @gw_no_disponible;
        error_page 504 = @gw_tiempo_agotado;

        proxy_pass http://dominio/campanas/;
    }

    # Rutas API desconocidas.
    location = /api {
        return 404 '{"error":"ruta_no_encontrada"}';
    }

    location /api/ {
        return 404 '{"error":"ruta_no_encontrada"}';
    }

    # Frontend.
    location / {
        set $gw_ruta "front";

        if ($request_method !~ ^(GET|HEAD)$) {
            add_header Allow "GET, HEAD" always;
            return 405 '{"error":"metodo_no_permitido"}';
        }

        error_page 502 503 = @gw_no_disponible;
        error_page 504 = @gw_tiempo_agotado;

        proxy_pass http://front;
    }

    # Servicio interno no disponible.
    location @gw_no_disponible {
        return 502 '{"error":"servicio_no_disponible","servicio":"$gw_ruta"}';
    }

    # Servicio interno demasiado lento.
    location @gw_tiempo_agotado {
        return 504 '{"error":"tiempo_de_espera_agotado","servicio":"$gw_ruta"}';
    }

    # Limite compartido por los dos aliases de campanas.
    location @gw_limite_solicitudes {
        add_header Retry-After "60" always;
        return 429 '{"error":"limite_de_solicitudes_excedido"}';
    }
}
