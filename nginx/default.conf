    # API Gateway - Nexus Retail - Fase 2
#
# /               -> front:80
# /api/dominio/   -> dominio:3000
# /api/ia/        -> ia:8000
# /health         -> Gateway

# Logs sin IP, URL ni parametros personales.
log_format gateway 'metodo=$request_method estado=$status bytes=$body_bytes_sent '
                   'duracion=$request_time upstream=$upstream_response_time '
                   'ruta=$gw_ruta';

# Servicios internos.
upstream front {
    zone front 64k;
    resolver 127.0.0.11 valid=2s ipv6=off;
    server front:80 resolve;
}

upstream dominio {
    zone dominio 64k;
    resolver 127.0.0.11 valid=2s ipv6=off;
    server dominio:3000 resolve;
}

upstream ia {
    zone ia 64k;
    resolver 127.0.0.11 valid=2s ipv6=off;
    server ia:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    absolute_redirect off;

    access_log /var/log/nginx/access.log gateway;

    error_log /var/log/nginx/error.log crit;

    default_type application/json;
    types { }

    set $gw_ruta "gateway";

    # Configuracion general de comunicacion interna
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    proxy_next_upstream error timeout;
    proxy_intercept_errors off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Healthcheck local del Gateway.
    location = /health {
        access_log off;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405 '{"error":"metodo_no_permitido"}';
        }

        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    # Dominio: redireccion cuando falta la barra final.
    location = /api/dominio {
        return 308 /api/dominio/$is_args$args;
    }

    # Dominio: elimina el prefijo /api/dominio/.
    location /api/dominio/ {
        set $gw_ruta "dominio";

        error_page 502 503 = @gw_no_disponible;
        error_page 504 = @gw_tiempo_agotado;

        proxy_pass http://dominio/;
    }

    # IA: redireccion cuando falta la barra final.
    location = /api/ia {
        return 308 /api/ia/$is_args$args;
    }

    # IA: elimina el prefijo /api/ia/.
    location /api/ia/ {
        set $gw_ruta "ia";

        if ($request_method !~ ^(GET|POST)$) {
            add_header Allow "GET, POST" always;
            return 405 '{"error":"metodo_no_permitido"}';
        }

        error_page 502 503 = @gw_no_disponible;
        error_page 504 = @gw_tiempo_agotado;

        proxy_pass http://ia/;
    }

    # Rutas API desconocidas.
    location = /api {
        return 404 '{"error":"ruta_no_encontrada"}';
    }

    location /api/ {
        return 404 '{"error":"ruta_no_encontrada"}';
    }

    # Frontend.
    location / {
        set $gw_ruta "front";

        if ($request_method !~ ^(GET|HEAD)$) {
            add_header Allow "GET, HEAD" always;
            return 405 '{"error":"metodo_no_permitido"}';
        }

        error_page 502 503 = @gw_no_disponible;
        error_page 504 = @gw_tiempo_agotado;

        proxy_pass http://front;
    }

    # Servicio interno no disponible.
    location @gw_no_disponible {
        return 502 '{"error":"servicio_no_disponible","servicio":"$gw_ruta"}';
    }

    # Servicio interno demasiado lento.
    location @gw_tiempo_agotado {
        return 504 '{"error":"tiempo_de_espera_agotado","servicio":"$gw_ruta"}';
    }
}